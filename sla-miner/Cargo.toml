[package]
name = "sla-miner"
version = "0.2.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tower = "0.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
vercel_runtime = { version = "2.4.1", features = ["axum"] }

[lib]
name = "sla_miner"
path = "src/lib.rs"

# local / Docker server
[[bin]]
name = "sla-miner"
path = "src/main.rs"

# Vercel function (Root Directory = sla-miner/)
[[bin]]
name = "sla"
path = "api/sla.rs"
