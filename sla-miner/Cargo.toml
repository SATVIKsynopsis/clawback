[package]
name = "sla-miner"
version = "0.2.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

[lib]
name = "sla_miner"
path = "src/lib.rs"

# HTTP server: local, Docker, and Vercel (standalone Rust server mode runs src/main.rs on $PORT)
[[bin]]
name = "sla-miner"
path = "src/main.rs"
